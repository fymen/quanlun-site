{{- $store := site.Params.purchase -}}
<div class="purchase-details">
  <div class="purchase-channel">
    <p class="purchase-store">{{ i18n "store_label" }}{{ with $store.store }} <strong>{{ . }}</strong>{{ end }}</p>
    {{- with $store.store }}
    <p class="purchase-description">{{ i18n "store_description" (dict "Store" .) }}</p>
    {{- end }}
    {{- with $store.url }}
    <a class="book-button" href="{{ . }}" target="_blank" rel="noopener noreferrer">{{ i18n "store_button" }} <span aria-hidden="true">↗</span></a>
    {{- else }}
    <button class="book-button purchase-pending" type="button" disabled aria-describedby="purchase-status">{{ i18n "store_pending" }}</button>
    <p class="purchase-status" id="purchase-status">{{ i18n "store_status" }}</p>
    {{- end }}
  </div>
</div>

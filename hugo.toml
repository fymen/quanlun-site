baseURL = 'https://www.buzhengjingquanlun.com/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '不正经拳论'
theme = 'PaperMod'
hasCJKLanguage = true
enableRobotsTXT = true
[pagination]
pagerSize = 8
[params]
env = 'production'
title = '不正经拳论'
description = '内家拳研习心得。从空、静出发，深入探讨内家拳的“中”，以及这个“中”在拳中的应用。'
author = '风茂'
defaultTheme = 'light'
disableThemeToggle = true
ShowReadingTime = true
ShowWordCount = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowShareButtons = false
ShowToc = true
